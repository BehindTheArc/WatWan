<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와알못의 홀짝 시음기</title>
<meta name="theme-color" content="#6E1E33">
<meta name="description" content="와인 셀러, 시음 노트, 쟁여놓기까지 — 와알못을 위한 와인 기록 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="홀짝 시음기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정한 개인 기록장, 와인 바의 셀러 카드처럼 차분하고 따뜻하게
   IDEA: 와인 셀러 선반 — 병이 눕고 서 있는 랙, 라벨이 곧 기록
   PICTURE: 라벨 사진을 입힌 와인병 일러스트가 셀러 선반에 줄지어 선다
   COLOUR and TYPE: 클라렛 와인색 주조, 포도잎 그린 보조, 로제 핑크 포인트 / Hahmlet + IBM Plex Sans KR
   LAYOUT: 모바일 한 컬럼, 아래 탭바 4개, 시트형 입력창 */
:root{color-scheme:light dark;
  --bg:light-dark(#FBF8F7,#160E11); --card:light-dark(#FFFFFF,#22161A); --ink:light-dark(#24161B,#F3E9EC);
  --muted:light-dark(#7C6A70,#B29EA5); --line:light-dark(#EDE3E5,#3A272E); --soft:light-dark(#F4ECEE,#2C1D23);
  --wine:light-dark(#6E1E33,#D9647F); --wine-2:light-dark(#8E2C47,#E88AA0); --wine-ink:#fff;
  --vine:light-dark(#4D6A45,#9CC08F); --rose:light-dark(#E08A9A,#E08A9A); --gold:light-dark(#B88A2E,#E0BC6A);
  --shelf:light-dark(#5A2A33,#3B1D25);
  --serif:'Hahmlet',serif; --sans:'IBM Plex Sans KR',system-ui,sans-serif; --tabh:64px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
a{color:var(--wine)}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(var(--tabh) + env(safe-area-inset-bottom) + 30px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 16px}
.top h1{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.5px}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.badge{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:clamp(10.5px,2.9vw,12px);white-space:nowrap;letter-spacing:-.3px}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--wine);font-weight:700}.tabbar a.on svg{stroke-width:2.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:none;background:var(--wine);color:var(--wine-ink);border-radius:13px;padding:11px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn.soft{background:var(--soft);color:var(--ink)}.btn.ghost{background:transparent;border:1px solid var(--wine);color:var(--wine)}
.btn.warn{background:#A23B2A;color:#fff}.btn.block{width:100%}.btn.sm{padding:7px 12px;font-size:13.5px;min-height:36px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,.li:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip,.chips.scroll button{flex:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap;min-height:36px}
.chip.on{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.chip .ck{color:var(--vine);font-weight:700;margin-left:3px}.chip.on .ck{color:#fff}
.sec{margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-family:var(--serif);font-size:20px;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.empty{text-align:center;padding:30px 14px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:19px;color:var(--ink);margin:10px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:clamp(18px,5vw,22px);white-space:nowrap}
.stats span{font-size:12px;color:var(--muted)}
/* cellar: wine fridge */
.fridge{background:linear-gradient(#2c2528,#121011);border-radius:22px;padding:10px 10px 0;box-shadow:0 16px 32px rgba(30,8,15,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.fr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 8px 10px}
.fr-name{font-family:var(--serif);font-weight:700;color:#eadccf;font-size:15px}
.fr-disp{display:flex;align-items:baseline;gap:4px;background:#090707;border:1px solid #33292d;border-radius:8px;padding:3px 10px;color:#ffb46b;text-shadow:0 0 8px rgba(255,160,80,.55);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.fr-disp b{font-size:18px}.fr-disp i{font-style:normal;font-size:12px;color:#d99a5e;margin-left:8px}
.fr-door{position:relative;border-radius:14px;padding:7px 22px 7px 7px;background:linear-gradient(90deg,#1b1618,#2e2629);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.fr-in{position:relative;border-radius:9px;overflow:hidden;padding:20px 6px 6px;box-shadow:inset 0 0 18px rgba(60,30,10,.35),inset 0 0 0 1px rgba(0,0,0,.25);
  background:radial-gradient(120% 38% at 50% 0%,rgba(255,250,238,.95),transparent 70%),linear-gradient(90deg,rgba(90,55,25,.22),transparent 14%,transparent 86%,rgba(90,55,25,.22)),repeating-linear-gradient(90deg,rgba(120,80,40,.07) 0 1px,transparent 1px 16px),linear-gradient(#f1e6d4,#d8c3a2)}
.fr-in::before{content:"";position:absolute;left:8%;right:8%;top:0;height:3px;border-radius:0 0 4px 4px;background:#ffdcae;box-shadow:0 0 16px 5px rgba(255,190,120,.5)}
.fr-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px}
.cell{display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0;position:relative;color:inherit}
.cell .bt{height:150px;display:flex;align-items:flex-end;justify-content:center;position:relative;width:100%}
.cell .bt::after{content:"";position:absolute;top:8px;bottom:6px;left:50%;width:84px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);z-index:0}
.cell svg{height:150px;width:auto;position:relative;z-index:1;filter:drop-shadow(0 4px 4px rgba(60,25,10,.35));transition:transform .2s}
button.cell:hover svg,button.cell:focus-visible svg{transform:translateY(-5px)}
.plank{display:block;align-self:stretch;height:13px;position:relative;z-index:2;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,transparent 1px 19px),linear-gradient(#8a5630,#5e3519 65%,#3f2210);box-shadow:0 6px 9px rgba(60,25,10,.35)}
.fr-row .cell:first-child .plank{border-radius:3px 0 0 3px}.fr-row .cell:last-child .plank{border-radius:0 3px 3px 0}
.tg{display:block;margin-top:9px;width:88%;background:#fffdf8;border:1px solid rgba(110,30,51,.18);color:#3a1a22;border-radius:3px 3px 7px 7px;padding:5px 6px 6px;line-height:1.3;text-align:center;box-shadow:0 3px 5px rgba(0,0,0,.45);position:relative;transform:rotate(-1.5deg)}
.cell:nth-child(2) .tg{transform:rotate(1.5deg)}
.tg::before{content:"";position:absolute;top:-9px;left:50%;width:1px;height:9px;background:#8a6a4a}
.tg b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:12.5px}
.tg small{display:block;color:#7c6a70;font-size:12px;word-break:keep-all}
.fr-glass{position:absolute;inset:7px 22px 7px 7px;border-radius:9px;pointer-events:none;z-index:4;background:linear-gradient(112deg,rgba(255,255,255,.10) 0 13%,transparent 22% 60%,rgba(255,255,255,.05) 65% 69%,transparent 77%)}
.fr-handle{position:absolute;right:7px;top:20%;bottom:20%;width:7px;border-radius:5px;background:linear-gradient(90deg,#7d7a7c,#ecebec,#6f6c6e);box-shadow:0 3px 5px rgba(0,0,0,.5)}
.fr-base{height:28px;margin:9px 6px 0;border-radius:0 0 14px 14px;background:repeating-linear-gradient(90deg,#0b0909 0 3px,#2a2326 3px 6px)}
.qty{position:absolute;top:2px;right:12%;z-index:3;background:var(--rose);color:#2a0d15;font-size:12px;font-weight:700;border-radius:99px;min-width:24px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px}
@media(max-width:380px){.cell .bt,.cell svg{height:128px}.fr-door{padding-right:18px}}
/* list items */
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.item svg.b{width:34px;height:auto}
.item .t{font-weight:700;line-height:1.3}
.item .s{font-size:13px;color:var(--muted)}
.stars{position:relative;display:inline-block;color:var(--line);white-space:nowrap;line-height:1.2;vertical-align:-1px}
.stars .sf{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);white-space:nowrap}
.rv{font-size:.85em;font-weight:700;color:var(--gold);margin-left:4px}
.rb{display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.rb.r0{background:var(--soft);color:var(--muted)}.rb.r1{background:color-mix(in srgb,var(--vine) 16%,transparent);color:var(--vine)}.rb.r2{background:var(--wine);color:#fff}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.mini div{font-size:11px;color:var(--muted)}.mini i{display:block;height:5px;border-radius:9px;background:var(--soft);margin-top:2px;position:relative;overflow:hidden}
.mini i b{position:absolute;inset:0 auto 0 0;background:var(--wine-2);border-radius:9px}
/* centered modal */
.scrim{position:fixed;inset:0;background:rgba(20,8,12,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.mw{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));pointer-events:none}
.mw.on{pointer-events:auto}
.sheet{position:relative;width:100%;max-width:500px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px;padding:14px 18px 22px;box-shadow:0 24px 60px rgba(20,5,10,.35);opacity:0;transform:scale(.96) translateY(10px);transition:opacity .2s,transform .2s ease}
.mw.on .sheet{opacity:1;transform:none}
.sheet h2{font-family:var(--serif);font-size:22px;margin:4px 48px 14px 0}
.sheet .x{position:sticky;top:0;float:right;z-index:3;margin:0 -6px 0 0;width:40px;height:40px;border:none;background:var(--soft);border-radius:50%;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px}
label.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px;font-size:14px;min-height:44px}
.seg button.on{background:var(--wine);color:#fff;border-color:var(--wine);font-weight:700}
.starin{display:flex;align-items:center;gap:14px;margin:2px 0 14px}
.starin .sw{position:relative;font-size:40px;line-height:1.1;letter-spacing:2px}
.starin .hits{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}
.starin .hits button{border:none;background:none;padding:0;min-height:44px}
.starin b{font-family:var(--serif);font-size:22px;color:var(--wine);min-width:60px}
.sl{margin-bottom:12px}
.sl .h{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.sl .h em{font-style:normal;color:var(--wine);font-weight:700}
.sl input{width:100%;accent-color:var(--wine);height:32px}
.sl .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-4px}
.photo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:12px;margin-bottom:14px}
.photo svg{width:56px;height:auto}
.crop{position:relative;margin:0 auto 12px;overflow:hidden;border-radius:10px;background:#000;touch-action:none;cursor:grab}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.crop::after{content:"";position:absolute;inset:0;border:2px solid #E08A9A;border-radius:10px;pointer-events:none}
.crop .cl{position:absolute;left:50%;transform:translate(-50%,4px);font-size:12px;font-weight:700;color:#fff;background:rgba(110,30,51,.85);border-radius:6px;padding:1px 7px;white-space:nowrap;pointer-events:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-bottom:16px}
.hero svg.b{width:88px;height:auto;filter:drop-shadow(0 6px 8px rgba(40,10,20,.25))}
.hero .t{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.25}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.acts.four{grid-template-columns:repeat(4,minmax(0,1fr))}.acts .btn{padding:10px 6px;font-size:14px}
@media(max-width:400px){.acts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.glass{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.glass button{flex:none;border:none;padding:0;background:none;text-align:center}
.glass img{display:block;width:140px;height:175px;object-fit:cover;border-radius:10px;box-shadow:0 3px 8px rgba(40,10,20,.25)}.glass small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.opened{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--wine);border-radius:99px;padding:1px 8px;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;background:var(--soft);border-radius:99px;padding:3px 10px}
.radar{display:block;width:100%;max-width:320px;margin:4px auto 0}
/* learn */
.grape{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px}
.bar{font-size:12.5px}.bar i{display:block;height:7px;border-radius:9px;background:var(--soft);margin-top:3px;position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--wine);border-radius:9px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px dashed var(--line)}
.wl li:first-child{border-top:none}
.wl .p{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.wl .done{font-size:11.5px;color:var(--vine);font-weight:700}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.src:first-of-type{border-top:none}
.src .n{font-weight:700}.src .d{font-size:13px;color:var(--muted);grid-column:1}
.src .sc{grid-row:1/3;grid-column:2;font-size:12px;color:var(--wine);font-weight:700;white-space:nowrap;text-align:right}
details{border-top:1px solid var(--line);padding:12px 0}details:first-of-type{border-top:none}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--wine);font-weight:700}details[open] summary::after{content:"–"}
details p,details ul{font-size:14.5px;margin:8px 0 0}details ul{padding-left:18px}
.ai{background:color-mix(in srgb,var(--wine) 7%,var(--card));border:1px solid color-mix(in srgb,var(--wine) 25%,var(--line));border-radius:18px;padding:16px;margin-bottom:14px}
.ai .out{white-space:pre-wrap;font-size:14.5px;line-height:1.65;margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{font-size:13.5px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;text-decoration:none;background:var(--card)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs button{flex:0 0 96px;border:none;background:none;padding:0;text-align:center}
.hs svg{width:46px;height:auto}.hs .nm{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* more */
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 16px;border:none;border-top:1px solid var(--line);background:none;text-align:left;min-height:52px;font-size:15px}
.li:first-child{border-top:none}.li .r{color:var(--muted);font-size:14px;text-align:right}
.li select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px}
.list-h{font-size:13px;color:var(--muted);margin:20px 4px 8px;font-weight:600}
.maker{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;font-size:22px;flex:none}
.mlinks{display:flex;gap:8px;margin-top:12px}.mlinks button{flex:1}
.sug{display:flex;flex-direction:column;margin-top:6px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:var(--card);padding:9px 12px;min-height:48px}
.sug button:first-child{border-top:none}.sug button:hover,.sug button:focus-visible{background:var(--soft)}
.sug b{display:block;font-size:15px;font-weight:600}.sug small{display:block;color:var(--muted);font-size:13px}
.sbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}.sbtn.off{opacity:.4;pointer-events:none}
.lt{display:block;width:auto;max-width:76px;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px rgba(40,10,20,.25);background:var(--soft)}
.item.st{grid-template-columns:76px minmax(0,1fr);align-items:center}.item.st svg.b{width:40px;justify-self:center}
.lbl{display:flex;gap:10px;align-items:flex-end;justify-content:center;background:var(--soft);border-radius:18px;padding:14px}
.lbl button{border:none;background:none;padding:0;position:relative}
.lbl .main img{display:block;max-height:min(46vh,380px);max-width:100%;width:auto;border-radius:8px;box-shadow:0 6px 18px rgba(40,10,20,.3)}
.lbl .neck img{display:block;width:96px;border-radius:6px;box-shadow:0 4px 10px rgba(40,10,20,.3)}
.lbl .neck span{display:block;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.lbl.empty{justify-content:flex-start;align-items:center;gap:16px;margin-bottom:14px}.lbl.empty svg.b{width:44px;flex:none}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,4,6,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;border-radius:6px}.lb span{color:#ddd;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:380px){.acts{grid-template-columns:1fr 1fr}.slot svg{width:50px}}
</style>

<script>
{
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const won = n => (n || n === 0) && n !== '' ? Number(n).toLocaleString('ko-KR') + '원' : '—';
function toast(msg, ms = 2400){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
const heldText = (from, tail = '째') => { const p = period(from); return p === '오늘' ? '오늘 구매' : p + tail; };
function period(from, to){
  if(!from) return '';
  const a = new Date(from), b = to ? new Date(to) : new Date();
  const days = Math.max(0, Math.floor((b - a) / 864e5));
  if(days < 31) return days === 0 ? '오늘' : days + '일';
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if(b.getDate() < a.getDate()) m--;
  m = Math.max(1, m); const y = Math.floor(m / 12), r = m % 12;
  return y ? (y + '년' + (r ? ' ' + r + '개월' : '')) : r + '개월';
}
const monthsHeld = from => from ? Math.floor((new Date() - new Date(from)) / (864e5 * 30.44)) : 0;
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('복사했어요'); }catch(e){ toast('복사가 막혀 있어요. 길게 눌러 직접 복사해주세요.'); } }

/* ================= constants ================= */
const TYPES = [
  {id:'red', name:'레드', glass:'#2E1A12', label:'#F3E6D2'},
  {id:'white', name:'화이트', glass:'#B8C27A', label:'#FBF6E6'},
  {id:'rose', name:'로제', glass:'#E9A3A8', label:'#FFF4F1'},
  {id:'sparkling', name:'스파클링', glass:'#24361F', label:'#F7EFD8'},
  {id:'dessert', name:'디저트', glass:'#8A5A1E', label:'#FFF4D9'},
  {id:'etc', name:'기타', glass:'#3B2A33', label:'#EEE6E9'}
];
const typeOf = id => TYPES.find(t => t.id === id) || TYPES[0];
const COUNTRIES = ['프랑스','이탈리아','스페인','미국','칠레','아르헨티나','호주','뉴질랜드','독일','포르투갈','남아공','오스트리아','한국','기타'];
const TRAITS = [
  {k:'sweet', n:'당도', a:'드라이', b:'스위트'},
  {k:'acid', n:'산도', a:'부드러움', b:'상큼·쨍함'},
  {k:'tannin', n:'타닌', a:'안 느껴짐', b:'떫고 강함'},
  {k:'body', n:'바디감', a:'가벼움', b:'묵직함'},
  {k:'visc', n:'점도', a:'물처럼', b:'진득함'},
  {k:'alc', n:'알코올감', a:'순함', b:'화끈함'},
  {k:'finish', n:'여운', a:'짧음', b:'길게 남음'}
];
const TEXTURES = ['실키','벨벳','크리미','매끈','오일리','거침','버블감'];
const AROMAS = ['붉은 과일','검은 과일','시트러스','사과·배','열대과일','꽃','허브','향신료','오크·바닐라','초콜릿·커피','흙·버섯','가죽·담배','견과','꿀','미네랄','버터'];
const REBUY = [{v:0, n:'의향 없음'},{v:1, n:'의향 있음'},{v:2, n:'완전 강추'}];
const BANDS = [{id:'b1', n:'3만원 이하'},{id:'b2', n:'3~7만원'},{id:'b3', n:'7~15만원'},{id:'b4', n:'15만원 이상'}];

/* ================= wine bottle drawing ================= */
const BOTTLE_PATH = 'M24 6h12v44c0 12 18 18 18 38v102q0 6-6 6H12q-6 0-6-6V88c0-20 18-26 18-38z';
const LABEL_BODY = {x:8, y:110, w:44, h:72}, LABEL_NECK = {x:12, y:63, w:36, h:24}; /* LABEL_NECK = 병목 아래 어깨에 붙는 작은 라벨 */
let BID = 0; /* 사진 틀이 덮는 병의 세로 구간 (viewBox 단위) */
function bottle(w = {}, cls = ''){
  const t = typeOf(w.type);
  const nm = (w.name || 'WINE').split(/\s+/).reduce((a, p) => (a + ' ' + p).trim().length <= 8 ? (a + ' ' + p).trim() : a, '') || (w.name || '').slice(0, 6);
  const foil = w.type === 'sparkling' ? '#C9A646' : (w.type === 'white' ? '#D8C9A0' : '#6E1E33');
  const L = LABEL_BODY, N = LABEL_NECK;
  const lab = w.photo
    ? `<image href="${w.photo}" x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" preserveAspectRatio="xMidYMid slice"/>`
    : `<rect x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" fill="${t.label}"/><line x1="13" y1="${L.y + 12}" x2="47" y2="${L.y + 12}" stroke="#6E1E33" stroke-width=".8"/>
       <text x="30" y="${L.y + 32}" text-anchor="middle" font-family="Hahmlet,serif" font-weight="700" font-size="${Math.min(8, 36 / Math.max(1, nm.length)).toFixed(2)}" fill="#3A1A22">${esc(nm)}</text>
       <text x="30" y="${L.y + 48}" text-anchor="middle" font-family="serif" font-size="7" fill="#7C6A70">${esc(w.vintage || 'NV')}</text>`;
  const cid = 'bc' + (++BID);
  const neckIn = w.neckPhoto
    ? `<image href="${w.neckPhoto}" x="${N.x}" y="${N.y}" width="${N.w}" height="${N.h}" preserveAspectRatio="xMidYMid slice"/>`
    : w.photo ? '' : `<rect x="${N.x}" y="${N.y}" width="${N.w}" height="${N.h}" fill="${t.label}"/><rect x="${N.x + 2}" y="${N.y + 2}" width="${N.w - 4}" height="${N.h - 4}" fill="none" stroke="#6E1E33" stroke-width=".5"/>
       <circle cx="30" cy="${N.y + N.h / 2 + 1}" r="4.2" fill="none" stroke="#8A6A3A" stroke-width=".7"/><text x="30" y="${N.y + 7}" text-anchor="middle" font-family="serif" font-size="3.6" fill="#3A1A22">${esc((w.name || '').split(/\s+/)[0].slice(0, 10))}</text>`;
  const neck = neckIn ? `<g clip-path="url(#${cid})">${neckIn}<rect x="${N.x}" y="${N.y}" width="${N.w}" height="${N.h}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width=".6"/></g>` : '';
  return `<svg class="${cls}" viewBox="0 0 60 200" aria-hidden="true">
    <defs><clipPath id="${cid}"><path d="${BOTTLE_PATH}" transform="translate(30 0) scale(.94 1) translate(-30 0)"/></clipPath></defs>
    <path d="${BOTTLE_PATH}" fill="${t.glass}" stroke="rgba(0,0,0,.35)" stroke-width=".6"/>
    ${w.openedAt ? `<rect x="22.5" y="16" width="15" height="21" rx="1.5" fill="${foil}"/><rect x="25" y="1" width="10" height="16" rx="1.5" fill="#C9A06A"/><line x1="26.5" y1="4" x2="33.5" y2="4" stroke="#8A6438" stroke-width=".6"/><line x1="26.5" y1="8" x2="33.5" y2="8" stroke="#8A6438" stroke-width=".6"/>` : `<rect x="22.5" y="3" width="15" height="34" rx="2" fill="${foil}"/>`}
    ${neck}
    ${lab}
    <rect x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>
    <rect x="11" y="78" width="3.2" height="110" rx="1.6" fill="#fff" opacity=".2"/>
    <rect x="25.5" y="38" width="1.6" height="14" rx=".8" fill="#fff" opacity=".18"/>
    <path d="M17 70q-3 4-4.5 9" stroke="#fff" stroke-width="1.6" fill="none" opacity=".18" stroke-linecap="round"/>
  </svg>`;
}

/* ================= store ================= */
const LS = 'wine.v1';
const LONG_OPTS = [[1,'한 달'],[3,'3개월'],[6,'6개월'],[12,'12개월'],[18,'1년 반'],[24,'2년'],[36,'3년'],[48,'4년'],[60,'5년 이상']];
const longLabel = m => (LONG_OPTS.find(o => o[0] == m) || [m, m + '개월'])[1].replace(' 이상', '');
const defSettings = () => ({ nickname:'와알못', longMonths:24, sort:'recent', createdAt: today() });
const Store = {
  mode:'local', db:null, uid:null, chains:{},
  S:{ settings:defSettings(), wines:{}, tastings:{}, market:{} },
  loadLocal(){ try{ const raw = localStorage.getItem(LS); if(!raw) return; const d = JSON.parse(raw);
    this.S.wines = d.wines || {}; this.S.tastings = d.tastings || {}; this.S.market = d.market || {}; this.S.settings = {...defSettings(), ...(d.settings || {})}; }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(this.S)); }catch(e){
    try{ const lite = JSON.parse(JSON.stringify(this.S)); for(const k of ['wines','tastings']) Object.values(lite[k]).forEach(x => { delete x.photo; delete x.neckPhoto; }); localStorage.setItem(LS, JSON.stringify(lite)); }catch(_){} } },
  lib(){ return this.db.doc('data/users/' + this.uid + '/lib'); },
  enqueue(key, fn){
    const p = (this.chains[key] || Promise.resolve()).then(fn).catch(e => {
      console.warn('write failed', e);
      if(e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 라벨 사진을 지워주세요.');
      else if(e && e.code === 'invalid_argument'){ this.mode = 'local'; toast('계정 저장이 막혀 이 브라우저에만 저장할게요.'); render(); }
    });
    this.chains[key] = p; return p;
  },
  async connect(){
    try{
      if(!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if(!db || !user) return;
      const id = await user.id(); if(!id) return;
      this.db = db; this.uid = id;
      const lib = this.lib();
      const timeout = new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000));
      const [ls, ws, ts, ms] = await Promise.race([Promise.all([lib.get(), lib.collection('wines').get(), lib.collection('tastings').get(), lib.collection('market').get()]), timeout]);
      this.mode = 'db';
      if(!ls.exists && ws.empty && ts.empty && ms.empty){
        await lib.set({ settings: JSON.parse(JSON.stringify(this.S.settings)) });
        for(const k of ['wines','tastings','market']) for(const it of Object.values(this.S[k])) await lib.collection(k).doc(it.id).set(JSON.parse(JSON.stringify(it)));
      } else {
        const clone = d => JSON.parse(JSON.stringify(d.data()));
        this.S.settings = {...defSettings(), ...(ls.exists ? (ls.data().settings || {}) : {})};
        this.S.wines = {}; ws.docs.forEach(d => this.S.wines[d.id] = clone(d));
        this.S.tastings = {}; ts.docs.forEach(d => this.S.tastings[d.id] = clone(d));
        this.S.market = {}; ms.docs.forEach(d => this.S.market[d.id] = clone(d));
        this.saveLocal();
      }
      render();
    }catch(e){ console.warn('db unavailable', e); this.mode = 'local'; render(); }
  },
  put(kind, item){ this.S[kind][item.id] = item; this.saveLocal();
    if(this.mode === 'db'){ const ref = this.lib().collection(kind).doc(item.id); const body = JSON.parse(JSON.stringify(item)); this.enqueue(kind + '/' + item.id, () => ref.set(body)); } },
  del(kind, id){ delete this.S[kind][id]; this.saveLocal();
    if(this.mode === 'db'){ const ref = this.lib().collection(kind).doc(id); this.enqueue(kind + '/' + id, () => ref.delete()); } },
  setSettings(p){ this.S.settings = {...this.S.settings, ...p}; this.saveLocal();
    if(this.mode === 'db'){ const body = { settings: JSON.parse(JSON.stringify(this.S.settings)) }; this.enqueue('lib', () => this.lib().set(body)); } },
  async resetAll(){
    if(this.mode === 'db') for(const k of ['wines','tastings','market']) for(const id of Object.keys(this.S[k])){ const ref = this.lib().collection(k).doc(id); this.enqueue(k + '/' + id, () => ref.delete()); }
    this.S.wines = {}; this.S.tastings = {}; this.S.market = {}; this.setSettings(defSettings());
  }
};
const S = () => Store.S;
const wines = () => Object.values(S().wines);
const inCellar = () => wines().filter(w => (w.qty ?? 1) > 0);
const finished = () => wines().filter(w => (w.qty ?? 1) <= 0);
const tastings = () => Object.values(S().tastings).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

/* ================= capabilities ================= */
let SAMPLE = null, DL = null;
const GKEY = 'wine.gemini';
const gemKey = () => { try{ return localStorage.getItem(GKEY) || ''; }catch(e){ return ''; } };
const BUILD_GH = true;
const GEM_MODELS = ['gemini-flash-lite-latest', 'gemini-3.5-flash-lite', 'gemini-2.5-flash-lite'];
const AUTO_AI_EN = !BUILD_GH;   /* GitHub판은 영문 변환에 AI를 쓰지 않음(무료 할당량 아끼기) */
async function blobToB64(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); }); }
const GEM_HINT = {
  ACCESS_TOKEN_TYPE_UNSUPPORTED:'Google이 이 새 형식(AQ.) 키를 아직 받아주지 않아요(Google 쪽 문제로 알려져 있어요). AI Studio에서 키를 새로 만들거나 잠시 뒤 다시 해보세요.',
  API_KEY_INVALID:'키가 맞지 않아요. 앞뒤 빈칸 없이 다시 복사해서 붙여넣어 주세요.',
  PERMISSION_DENIED:'이 키로는 Gemini API를 쓸 권한이 없어요. AI Studio에서 만든 키인지 확인해주세요.',
  SERVICE_DISABLED:'키를 만든 프로젝트에 Gemini API가 꺼져 있어요. AI Studio에서 키를 새로 만들어주세요.',
  RESOURCE_EXHAUSTED:'무료 사용량을 다 썼거나 이 프로젝트의 무료 한도가 0이에요. 잠시 뒤 다시 하거나 AI Studio에서 새 프로젝트로 키를 만들어보세요.',
  FAILED_PRECONDITION:'이 지역이나 계정에서는 무료 Gemini를 쓸 수 없다고 나와요.'
};
async function geminiCall(key, prompt, opts = {}){
  key = String(key || '').replace(/[\s"'“”‘’]/g, '');
  const text = typeof prompt === 'string' ? prompt : prompt.map(m => m.content).join('\n\n');
  const parts = [{text}];
  for(const img of (opts.images || [])) parts.push({inline_data:{mime_type:img.type || 'image/jpeg', data:await blobToB64(img)}});
  const body = JSON.stringify({contents:[{role:'user', parts}], generationConfig:{maxOutputTokens:opts.maxTokens || 800}});
  let last = null;
  for(const model of GEM_MODELS){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    let r, d;
    /* 1차: x-goog-api-key 헤더, 인증 오류면 2차: ?key= 주소 방식으로 한 번 더 */
    for(const mode of ['header', 'query']){
      const ac = new AbortController(), tm = setTimeout(() => ac.abort(), opts.timeout || 25000);
      try{ r = mode === 'header'
        ? await fetch(url, {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':key}, body, signal:ac.signal})
        : await fetch(url + '?key=' + encodeURIComponent(key), {method:'POST', headers:{'Content-Type':'application/json'}, body, signal:ac.signal}); clearTimeout(tm); }
      catch(e){ clearTimeout(tm); if(e && e.name === 'AbortError') throw {code:'timeout', message:'Gemini 응답이 너무 늦어요. 잠시 뒤 다시 해주세요.'}; throw {code:'network', message:'인터넷 연결을 확인하거나, 회사·학교 와이파이라면 다른 네트워크로 해보세요.'}; }
      d = await r.json().catch(() => ({}));
      if(!(r.status === 401 || r.status === 403)) break;
    }
    if(r.status === 404){ last = {code:'model', message:`모델(${model})을 찾지 못했어요.`}; continue; }
    const err = d.error || {};
    const reason = ((err.details || []).find(x => x.reason) || {}).reason || err.status || '';
    if(!r.ok){
      const hint = GEM_HINT[reason] || GEM_HINT[err.status] || '';
      const code = r.status === 429 ? 'rate_limited' : (r.status === 400 || r.status === 401 || r.status === 403) ? 'bad_key' : 'error';
      throw {code, status:r.status, reason, message:(hint ? hint + ' ' : '') + `(오류 ${r.status}${reason ? ' · ' + reason : ''})`, raw:err.message || ''};
    }

let sheetHooks = null;
function openSheet(html, hooks = {}){
  const sh = $('#sheet');
  sh.innerHTML = `<button class="x" data-act="close" aria-label="닫기">✕</button>` + html;
  sh.scrollTop = 0; $('#mw').classList.add('on'); $('#scrim').classList.add('on'); sheetHooks = hooks;
  if(hooks.onMount) hooks.onMount(sh);
}
function closeSheet(){ $('#mw').classList.remove('on'); $('#scrim').classList.remove('on'); if(sheetHooks && sheetHooks.onClose) sheetHooks.onClose(); sheetHooks = null; }
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
$('#mw').addEventListener('click', e => { if(e.target.id === 'mw') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#mw').classList.contains('on')) closeSheet(); });

function pickFile(accept){
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
}
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; }); }
function shrink(img, max = 1024){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', .85));
}

  openSheet(`<div class="muted small" style="font-weight:700;color:var(--wine)">${o.step}</div><h2 style="margin-top:2px">${o.title}</h2>
    <p class="muted small" style="margin-top:-8px">${o.desc}</p>
    <div class="crop" id="cr" style="${tall ? 'height:min(50vh,400px)' : 'width:min(100%,330px)'};aspect-ratio:${o.r.w}/${o.r.h}"></div>
    <div class="sl"><div class="h"><span>확대</span></div><input type="range" id="cz" min="0.3" max="4" step="0.01" value="1"></div>
    <button class="btn block" id="cok">${o.ok}</button>${o.skip ? `<button class="btn soft block" style="margin-top:8px" id="csk">${o.skip}</button>` : ''}`, { onMount(p){
    const box = p.querySelector('#cr'), z = p.querySelector('#cz'); box.appendChild(img);
    let W, H, s0, sc, x = 0, y = 0;
    const clamp = () => { x = Math.min(0, Math.max(W - img.naturalWidth * sc, x)); y = Math.min(0, Math.max(H - img.naturalHeight * sc, y)); };
    const draw = () => { clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${sc})`; };
    const sMin = () => Math.max(W / img.naturalWidth, H / img.naturalHeight);
    requestAnimationFrame(() => { const r = box.getBoundingClientRect(); W = r.width; H = r.height;
      s0 = W / (img.naturalWidth * o.fw); sc = Math.max(s0, sMin()); z.min = (sMin() / s0).toFixed(3); z.value = sc / s0;
      x = W / 2 - img.naturalWidth * o.cx * sc; y = H / 2 - img.naturalHeight * o.cy * sc; draw(); });
    z.oninput = () => { const cx = (W / 2 - x) / sc, cy = (H / 2 - y) / sc; sc = Math.max(sMin(), s0 * z.value); x = W / 2 - cx * sc; y = H / 2 - cy * sc; draw(); };
    let drag = null;
    box.onpointerdown = e => { drag = {px:e.clientX, py:e.clientY, x, y}; box.setPointerCapture(e.pointerId); };
    box.onpointermove = e => { if(!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; draw(); };
    box.onpointerup = box.onpointercancel = () => drag = null;
    p.querySelector('#cok').onclick = () => { const c = document.createElement('canvas'); c.width = o.out[0]; c.height = o.out[1];
      c.getContext('2d').drawImage(img, -x / sc, -y / sc, W / sc, H / sc, 0, 0, c.width, c.height); o.done(c.toDataURL('image/jpeg', .82)); };
    const sk = p.querySelector('#csk'); if(sk) sk.onclick = () => o.done('');
  }});
}

async function corkSave(w, file){
  try{
    const img = await loadImg(file); const s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const photo = c.toDataURL('image/jpeg', .78);
    const cur = S().wines[w.id] || w;
    Store.put('wines', {...cur, openedAt:cur.openedAt || today(), glass:[{date:today(), photo}]});

  }catch(e){ toast('사진을 열지 못했어요'); }

function radar(tr){
  const n = TRAITS.length, cx = 160, cy = 132, R = 92;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 5, cy + Math.sin(a) * R * v / 5]; };
  const ring = v => TRAITS.map((_, i) => pt(i, v).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 320 264" role="img" aria-label="맛 특징 그래프">
    ${[1, 2, 3, 4, 5].map(v => `<polygon points="${ring(v)}" fill="none" stroke="var(--line)"/>`).join('')}
    ${TRAITS.map((_, i) => { const [x, y] = pt(i, 5); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('')}
    <polygon points="${TRAITS.map((x, i) => pt(i, tr[x.k] || 0).join(',')).join(' ')}" fill="color-mix(in srgb,var(--wine) 30%,transparent)" stroke="var(--wine)" stroke-width="2"/>
    ${TRAITS.map((x, i) => { const [lx, ly] = pt(i, 6.3); return `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="12.5" fill="var(--muted)" font-family="IBM Plex Sans KR,sans-serif">${x.n} ${tr[x.k] || 0}</text>`; }).join('')}
  </svg>`;
}

const hasKo = s => /[가-힣]/.test(s || '');
function enCached(name){
  if(!name) return '';
  if(!hasKo(name)) return name;
  const k = norm(name);
  const w = wines().find(x => norm(x.name) === k && x.nameEn); if(w) return w.nameEn;
  const m = S().market[mkey(name)]; if(m && m.en) return m.en;
  const kb = KB_WINES.find(x => norm(x.n) === k); if(kb) return kb.en;
  const nk = koNorm(name); const wn = WINE_NAMES.find(x => x.key === nk); if(wn) return wn.en;
  return '';
}

const KO_EN = (() => { const m = new Map(); (KO_EN_WORDS + '|' + KO_EN_RAW).replace(/\n/g, '').split('|').forEach(p => { const [k, v] = p.split('='); if(k) m.set(koNorm(k), v ?? ''); }); return m; })();
const KO_EN_MAX = Math.max(...[...KO_EN.keys()].map(k => k.length));
function roman(word){
  const I = ['g','k','n','d','t','r','m','b','p','s','s','','j','j','ch','k','t','p','h'];
  const V = ['a','e','ya','ye','o','e','yo','ye','o','wa','we','we','yo','u','wo','we','wi','yu','','ui','i'];
  const F = ['','k','k','k','n','n','n','t','l','l','l','l','l','l','l','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  let out = '', prevF = -1;
  for(const ch of word){
    const c = ch.charCodeAt(0) - 0xAC00;
    if(c < 0 || c > 11171){ out += ch; prevF = -1; continue; }
    const i = Math.floor(c / 588), v = Math.floor((c % 588) / 28), f = c % 28;
    let ini = I[i];
    if(i === 5 && (prevF === 8 || prevF === -1)) ini = 'l';   /* ㄹㄹ → l (클라 → kla), 첫 글자 ㄹ → l (롱 → long) */
    let vow = V[v];
    if(v === 18 && i === 11) vow = 'eu';          /* 으 */
    out += ini + vow + F[f]; prevF = f;
  }
  return out.replace(/ll(?=[aeiouy])/g, 'l');
}
const cap = w => w ? w[0].toUpperCase() + w.slice(1) : w;
function dictEn(text){
  const full = koNorm(text);
  const hit = WINE_NAMES.filter(x => full.startsWith(x.key)).sort((a, b) => b.key.length - a.key.length)[0];
  if(hit){ const rest = full.slice(hit.key.length); const r = rest ? dictEn(rest) : {text:'', guessed:false}; return {text:(hit.en + ' ' + r.text).trim(), guessed:r.guessed}; }
  const toks = String(text || '').trim().split(/\s+/).map(koNorm).filter(Boolean);
  const out = []; let guessed = false;
  /* 한 덩어리를 사전 단어로 빈틈없이 나눌 수 있을 때만 사전을 쓰고, 아니면 통째로 발음대로 바꿈 (오리지널 → Orijinol, 리지=Ridge로 쪼개지 않음) */
  const piece = t => {
    const n = t.length, best = Array(n + 1).fill(null); best[0] = [];
    for(let k = 0; k < n; k++){
      if(!best[k]) continue;
      if(!/[가-힣]/.test(t[k])){ let j = k; while(j < n && !/[가-힣]/.test(t[j])) j++; const c = [...best[k], t.slice(k, j)]; if(!best[j] || c.length < best[j].length) best[j] = c; continue; }
      for(let L = 1; L <= Math.min(KO_EN_MAX, n - k); L++){ const sub = t.slice(k, k + L); if(!KO_EN.has(sub)) continue;
        const c = [...best[k], KO_EN.get(sub)]; if(!best[k + L] || c.length < best[k + L].length) best[k + L] = c; }
    }
    if(best[n]) return best[n].filter(Boolean);
    guessed = true;
    return t.split(/(\d+)/).filter(Boolean).map(x => /\d/.test(x) ? x : cap(roman(x)));
  };
  for(let i = 0; i < toks.length;){
    let done = false;
    for(let n = Math.min(4, toks.length - i); n >= 2; n--){ const key = toks.slice(i, i + n).join(''); if(KO_EN.has(key)){ const v = KO_EN.get(key); if(v) out.push(v); i += n; done = true; break; } }
    if(done) continue;
    const t = toks[i]; if(KO_EN.has(t)){ const v = KO_EN.get(t); if(v) out.push(v); } else out.push(...piece(t)); i++;
  }
  return { text: out.join(' ').replace(/\s+/g, ' ').trim(), guessed };
}
const enGuess = name => enCached(name) || (hasKo(name) ? dictEn(name).text : name) || name;

const enPending = {};
async function ensureEn(name){
  const c = enCached(name); if(c) return c;
  if(!SAMPLE || !AUTO_AI_EN) return '';
  if(!enPending[name]) enPending[name] = (async () => {

와인: ${name}`, {modelTier:'quick'});
      const en = (txt || '').split('\n').map(x => x.trim()).filter(Boolean)[0]?.replace(/^["'“]|["'”]$/g, '') || '';

  })().finally(() => setTimeout(() => delete enPending[name], 0));
  return enPending[name];
}

const mkey = name => 'm' + hash(norm(name));
function hash(str){ let h = 5381; for(const c of String(str)) h = ((h << 5) + h + c.codePointAt(0)) | 0; return (h >>> 0).toString(36); }
const marketOf = name => S().market[mkey(name)] || null;
const manwon = n => n >= 1e4 ? (Math.round(n / 1000) / 10).toLocaleString('ko-KR') + '만원' : Number(n).toLocaleString('ko-KR') + '원';
const toNum = v => parseInt(String(v || '').replace(/[^\d]/g, ''), 10) || 0;

/* 마셔본 와인: 같은 이름끼리 묶어 평균 별점 순 */
function tastedGroups(){
  const g = new Map();
  for(const t of tastings()){
    const w = S().wines[t.wineId] || t.wine || {}; const k = norm(w.name); if(!k) continue;
    if(!g.has(k)) g.set(k, {key:k, wine:w, list:[]});
    const it = g.get(k); it.list.push(t); if(!it.wine.photo && w.photo) it.wine = w;
  }
  return [...g.values()].map(x => {
    const avg = x.list.reduce((s, t) => s + (+t.rating || 0), 0) / x.list.length;
    const last = x.list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    const paid = toNum(x.wine.price) || toNum((wines().find(w => norm(w.name) === x.key) || {}).price);
    return {...x, avg, last, paid};
  }).sort((a, b) => b.avg - a.avg || (b.last.date || '').localeCompare(a.last.date || ''));
}

function suggestWines(raw){
  const q = koNorm(raw), ql = raw.trim().toLowerCase(); if(!q) return [];
  const pool = [...wines().filter(w => w.nameEn).map(w => ({ko:w.name, en:w.nameEn})), ...KB_WINES.map(w => ({ko:w.n, en:w.en})), ...WINE_NAMES];
  const seen = new Set(), out = [];
  for(const x of pool){
    const k = koNorm(x.ko), e = x.en.toLowerCase();
    const at = k.indexOf(q), ae = e.indexOf(ql);
    if(at < 0 && ae < 0) continue;
    const id = e.replace(/[^a-z0-9]/g, ''); if(seen.has(id)) continue; seen.add(id);
    out.push({...x, score:(at === 0 || ae === 0 ? 0 : 1) * 1000 + k.length});
  }
  return out.sort((a, b) => a.score - b.score).slice(0, 6);
}
function wireStashSearch(){
  const i = $('#st-q'); if(!i) return;
  const ws = $('#st-ws'), nv = $('#st-nv'), vv = $('#st-vv'), info = $('#st-en'), enw = $('#st-enw'), eni = $('#st-en-i'), sug = $('#st-sug'), nvc = $('#st-nvc');
  let timer = null, seq = 0, edited = false;
  const apply = () => {
    const raw = i.value.trim(), on = !!raw;
    [ws, nv, vv].forEach(a => a.classList.toggle('off', !on));
    if(!on){ [ws, nv, vv].forEach(a => a.removeAttribute('href')); return; }
    const q = hasKo(raw) ? (eni.value.trim() || raw) : raw;
    ws.href = searchUrl.ws(q); vv.href = searchUrl.vivino(q); nv.href = searchUrl.naver(raw);
    nvc.href = 'https://search.naver.com/search.naver?query=' + encodeURIComponent(raw + ' 와인');
  };
  const showSug = raw => {
    const list = suggestWines(raw).filter(x => koNorm(x.ko) !== koNorm(raw));
    sug.innerHTML = list.map((x, n) => `<button type="button" role="option" data-n="${n}"><b>${esc(x.ko)}</b><small>${esc(x.en)}</small></button>`).join('');
    sug.querySelectorAll('button').forEach(btn => btn.onclick = () => { const x = list[+btn.dataset.n];
      i.value = x.ko; stashUI.q = x.ko; clearTimeout(timer); seq++; enw.style.display = ''; eni.value = x.en; edited = true; info.textContent = ''; sug.innerHTML = ''; apply(); });
  };
  const update = () => {
    const raw = i.value.trim(); stashUI.q = raw; const my = ++seq; clearTimeout(timer); edited = false;
    showSug(raw);
    if(!raw){ enw.style.display = 'none'; info.textContent = '한글로 써도 영문으로 바꿔서 검색해요. 이름 일부만 써도 아래에 추천이 떠요.'; apply(); return; }
    if(!hasKo(raw)){ enw.style.display = 'none'; info.textContent = ''; apply(); return; }
    enw.style.display = '';
    const c = enCached(raw);
    if(c){ eni.value = c; info.textContent = ''; apply(); return; }
    const g = dictEn(raw); eni.value = g.text; apply();
    if(!SAMPLE || !AUTO_AI_EN){ info.textContent = g.guessed ? '모르는 단어가 있어 발음대로 바꿨어요. 아래 추천에서 고르거나, 네이버에서 영문 이름을 확인해 고쳐주세요.' : ''; return; }
    info.innerHTML = '<span class="spin"></span>AI로 더 정확한 영문 이름을 찾는 중…';
    timer = setTimeout(async () => { const en = await ensureEn(raw); if(my !== seq) return;
      info.textContent = ''; if(en && !edited){ eni.value = en; apply(); } }, 700);
  };
  i.oninput = update; i.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); sug.innerHTML = ''; i.blur(); } };
  eni.oninput = () => { edited = true; apply(); };
  eni.onchange = () => { const raw = i.value.trim(), v = eni.value.trim(); if(raw && v && hasKo(raw)) saveEn(raw, v); };
  update(); sug.innerHTML = '';
}

/* ================= 키 없이 라벨 글자 읽기 (휴대폰 안에서 OCR) + 와인 찾기 ================= */
const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorkerP = null;
function loadOcr(onProg){
  if(!ocrWorkerP) ocrWorkerP = (async () => {
    if(!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = OCR_SRC; s.onload = res; s.onerror = () => rej({code:'ocr_load'}); document.head.appendChild(s); });
    return Tesseract.createWorker('eng', 1, { logger: m => { if(ocrWorkerP && ocrWorkerP.prog) ocrWorkerP.prog(m); } });
  })().catch(e => { ocrWorkerP = null; throw e; });
  ocrWorkerP.prog = onProg;
  return ocrWorkerP;
}
function prepCanvas(img, max = 1500){
  const s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const c = document.createElement('canvas'); c.width = Math.round((img.naturalWidth || img.width) * s); c.height = Math.round((img.naturalHeight || img.height) * s);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for(let i = 0; i < a.length; i += 4){ let v = .3 * a[i] + .59 * a[i + 1] + .11 * a[i + 2]; v = Math.max(0, Math.min(255, (v - 128) * 1.35 + 128)); a[i] = a[i + 1] = a[i + 2] = v; }
  g.putImageData(d, 0, 0); return c;
}
async function ocrRead(img, onProg){
  const w = await loadOcr(onProg);
  const r = await w.recognize(prepCanvas(img));
  return (r && r.data && r.data.text) || '';
}
const latin = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const OCR_STOP = new Set('wine wines vin vino vinho red white rouge blanc rosso bianco tinto the and of de du des la le les di del della y el en au aux est produced bottled product produce contains contient sulfites sulphites alc vol ml cl appellation controlee origine protegee denominazione controllata garantita mis bouteille imported importer by for from with grape grapes vintage reserve reserva riserva'.split(' '));
const ocrTokens = text => { const out = new Set(); for(const t of latin(text).split(' ')) if((t.length >= 3 || /\d/.test(t) && /[a-z]/.test(t)) && !OCR_STOP.has(t) && !/^\d+$/.test(t)) out.add(t); return [...out]; };
function lev(a, b){ if(a === b) return 0; const m = a.length, n = b.length; if(Math.abs(m - n) > 2) return 9; let p = Array.from({length:n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){ const c = [i]; for(let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function hist(src, center){
  const c = document.createElement('canvas'); c.width = c.height = 24; const g = c.getContext('2d');
  const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height;
  if(center) g.drawImage(src, W * .2, H * .2, W * .6, H * .6, 0, 0, 24, 24); else g.drawImage(src, 0, 0, 24, 24);
  const a = g.getImageData(0, 0, 24, 24).data, h = new Float32Array(64);
  for(let i = 0; i < a.length; i += 4) h[(a[i] >> 6) * 16 + (a[i + 1] >> 6) * 4 + (a[i + 2] >> 6)] += 1 / 576;
  return h;
}
const histSim = (x, y) => { let s = 0; for(let i = 0; i < 64; i++) s += Math.min(x[i], y[i]); return s; };
function wineCandidates(){
  const map = new Map();
  const add = (ko, en, extra = {}) => { if(!en || hasKo(en)) return; const k = latin(en); if(!k) return; const cur = map.get(k) || {ko, en, toks:ocrTokens(en)}; map.set(k, {...cur, ...extra, ko:cur.tasted || cur.cellar ? cur.ko : (extra.tasted || extra.cellar ? ko : cur.ko)}); };
  WINE_NAMES.forEach(x => add(x.ko, x.en)); KB_WINES.forEach(x => add(x.n, x.en));
  wines().forEach(w => add(w.name, enGuess(w.name), {cellar:(+w.qty || 0) > 0, photo:w.photo || ''}));
  tastedGroups().forEach(gp => add(gp.wine.name, enGuess(gp.wine.name), {tasted:true, avg:gp.avg, photo:gp.wine.photo || (wines().find(x => norm(x.name) === gp.key) || {}).photo || ''}));
  return [...map.values()].filter(x => x.toks.length);
}
async function matchLabel(text, img){
  const ot = ocrTokens(text); const cands = wineCandidates();
  const df = new Map(); cands.forEach(c => new Set(c.toks).forEach(t => df.set(t, (df.get(t) || 0) + 1)));
  const N = cands.length, wt = t => Math.log(1 + N / (df.get(t) || 1));
  const has = t => ot.some(o => o === t || (t.length >= 4 && Math.abs(o.length - t.length) <= 2 && lev(o, t) <= (t.length >= 7 ? 2 : 1)) || (t.length >= 5 && o.length >= 5 && (o.startsWith(t) || t.startsWith(o))));
  const shot = img ? hist(img, true) : null;
  const res = [];
  for(const c of cands){
    let tot = 0, got = 0, hits = 0;
    for(const t of c.toks){ const w = wt(t); tot += w; if(has(t)){ got += w; hits++; } }
    let score = tot ? got / tot : 0;
    if(!hits) continue;
    if(c.tasted) score += .08;
    if(shot && c.photo){ try{ const im = await loadImgUrl(c.photo); score += Math.max(0, histSim(shot, hist(im)) - .35) * .5; }catch(e){} }
    res.push({...c, score:Math.min(1, score), hits});
  }
  return res.filter(r => r.score >= .34).sort((a, b) => (b.score + b.hits * .04) - (a.score + a.hits * .04)).slice(0, 5);
}
const imgCache = new Map();
function loadImgUrl(u){ if(imgCache.has(u)) return imgCache.get(u); const p = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; }); imgCache.set(u, p); return p; }
const vintageIn = text => { const m = String(text).match(/\b(19[5-9]\d|20[0-3]\d)\b/); return m ? m[1] : ''; };
const ocrProgText = m => m && m.status === 'recognizing text' ? `라벨 글자 읽는 중… ${Math.round((m.progress || 0) * 100)}%` : m && /load|initial/.test(m.status || '') ? '글자 인식 도구 준비 중… (처음 한 번만 몇 초 걸려요)' : '';

  }[kind] || custom;
  learnUI.aiBusy = true; learnUI.ai = ''; learnUI.q = kind === 'custom' ? custom : ''; render();
  try{
    const txt = await ask(`당신은 와인 초보자를 돕는 한국어 소믈리에입니다. 마크다운 기호 없이 일반 텍스트로, 짧고 친근하게 답하세요. 가격은 대략이라고 밝히고, 평론가 점수는 확실하지 않으면 쓰지 마세요.

${ts}

  learnUI.aiBusy = false; render();
}

  if(DL){ try{ await DL.save({filename, data}); toast('저장했어요'); return; }catch(e){ if(e && e.code === 'declined') return; } }
  try{ const url = URL.createObjectURL(new Blob([data], {type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('백업 파일을 내려받았어요'); return; }catch(e){}
  openSheet(`<h2>백업 내보내기</h2><p class="muted small">이 화면에서는 파일 저장이 막혀 있어요. 아래 내용을 복사해 메모장에 붙여 .json 파일로 보관하세요.</p><button class="btn block" id="bk-c">전체 복사</button>`, { onMount(p){ p.querySelector('#bk-c').onclick = () => copyText(data); } });
}
async function restore(){
  const file = await pickFile('.json,application/json'); if(!file) return;
  let d; try{ d = JSON.parse(await file.text()); }catch(e){ toast('백업 파일을 읽지 못했어요'); return; }
  if(!d || !d.wines){ toast('이 앱의 백업 파일이 아니에요'); return; }
  openSheet(`<h2>백업 불러오기</h2><p>와인 ${Object.keys(d.wines || {}).length}병, 시음 노트 ${Object.keys(d.tastings || {}).length}개를 지금 기록에 합칠까요? 같은 항목은 백업 내용으로 바뀌어요.</p><button class="btn block" id="rt-go">불러오기</button>`, { onMount(p){
    p.querySelector('#rt-go').onclick = () => { for(const k of ['wines','tastings','market']) for(const it of Object.values(d[k] || {})) if(it && it.id) Store.put(k, it);
      if(d.settings) Store.setSettings(d.settings); closeSheet(); render(); toast('불러왔어요'); }; }});
}
function resetSheet(){
  openSheet(`<h2>모든 기록 초기화</h2><p>셀러의 와인, 시음 노트, 설정이 모두 지워져요. 되돌릴 수 없으니 먼저 백업을 내보내 두세요.</p>
    <button class="btn soft block" data-act="backup">백업 먼저 내보내기</button>
    <label class="f" style="margin-top:14px"><span>계속하려면 ‘초기화’라고 입력하세요</span><input id="rs-i" autocomplete="off"></label>
    <button class="btn warn block" id="rs-go" disabled>초기화</button>`, { onMount(p){
      const i = p.querySelector('#rs-i'), go = p.querySelector('#rs-go');
      i.oninput = () => go.disabled = i.value.trim() !== '초기화';
      go.onclick = async () => { await Store.resetAll(); closeSheet(); location.hash = 'cellar'; render(); toast('초기화했어요'); };
  }});
}
function confirmSheet(title, msg, btn, fn){
  openSheet(`<h2>${title}</h2><p>${msg}</p><button class="btn warn block" id="cf-go">${btn}</button><button class="btn soft block" style="margin-top:8px" data-act="close">취소</button>`, { onMount(p){ p.querySelector('#cf-go').onclick = () => { fn(); closeSheet(); render(); }; } });
}
function demo(){
  const d = (m) => { const x = new Date(); x.setMonth(x.getMonth() - m); return x.toISOString().slice(0, 10); };
  [{name:'몬테스 알파 카베르네 소비뇽', country:'칠레', region:'콜차구아 밸리', grape:'카베르네 소비뇽', vintage:'2021', type:'red', buyDate:d(14), price:'32000', shop:'예시 데이터', qty:2},
   {name:'클라우디 베이 소비뇽 블랑', country:'뉴질랜드', region:'말보로', grape:'소비뇽 블랑', vintage:'2023', type:'white', buyDate:d(3), price:'58000', shop:'예시 데이터', qty:1},
   {name:'모엣 & 샹동 브뤼 앵페리얼', country:'프랑스', region:'샹파뉴', grape:'샤르도네·피노 누아', vintage:'', type:'sparkling', buyDate:d(27), price:'89000', shop:'예시 데이터', qty:1, memo:'예시: 기념일에 열기'}]
   .forEach(w => Store.put('wines', {...w, id:uid(), createdAt:today()}));
  render(); toast('예시 와인을 넣었어요. 더보기에서 초기화할 수 있어요.', 3200);
}

/* ================= render & routing ================= */
const header = (t, sub) => `<div class="top"><div><h1>${t}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><span class="badge">${Store.mode === 'db' ? '☁︎ 계정에 저장 중' : '이 브라우저에 저장'}</span></div>`;
const TABS = ['cellar','notes','stash','learn','more'];
let TAB = 'cellar';
function render(){
  const h = location.hash.slice(1); TAB = TABS.includes(h) ? h : 'cellar';
  const y = window.scrollY, prev = render._tab;
  $('#app').innerHTML = ({cellar:viewCellar, notes:viewNotes, stash:viewStash, learn:viewLearn, more:viewMore})[TAB]();
  document.querySelectorAll('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === TAB));
  if(prev === TAB) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render._tab = TAB;
  const cs = $('#csort'); if(cs) cs.onchange = () => { Store.setSettings({sort:cs.value}); render(); };
  const sl = $('#set-long'); if(sl) sl.onchange = () => { Store.setSettings({longMonths:+sl.value}); toast('바꿨어요'); };
  const ss = $('#set-sort'); if(ss) ss.onchange = () => { Store.setSettings({sort:ss.value}); toast('바꿨어요'); };
  wireStashSearch();
  const aq = $('#aiq'); if(aq) aq.onsubmit = e => { e.preventDefault(); const v = $('#aiq-i').value.trim(); if(v) aiAsk('custom', v); };
}
window.addEventListener('hashchange', render);

const ACT = {
  'close': () => closeSheet(),
  'ctype': el => { cellarUI.type = el.dataset.v; render(); },
  'new-wine': () => wineForm({}),
  'demo': () => demo(),
  'wine': el => { const w = S().wines[el.dataset.id]; if(w) wineDetail(w); },
  'edit-wine': el => { const w = S().wines[el.dataset.id]; if(w) wineForm(w); },
  'del-wine': el => { const w = S().wines[el.dataset.id]; if(w) confirmSheet('와인 삭제', `‘${esc(w.name)}’을(를) 셀러에서 지울까요? 이 와인의 시음 노트는 그대로 남아요.`, '삭제', () => { Store.del('wines', w.id); toast('지웠어요'); }); },
  'cork': el => { const w = S().wines[el.dataset.id]; if(w) corkSheet(w); },
  'glass-view': el => lightbox(el.dataset.src),
  'drink': el => { const w = S().wines[el.dataset.id]; if(w) tastingForm({}, w); },
  'restock': el => { const w = S().wines[el.dataset.id]; if(w){ Store.put('wines', {...w, qty:1, finishDate:'', buyDate:today()}); closeSheet(); render(); toast('셀러에 다시 넣었어요'); } },
  'nf': el => { notesUI.f = el.dataset.v; render(); },
  'new-tasting': () => pickWineForTasting(),
  'tasting-free': () => tastingForm({}, {}),
  'tasting': el => { const t = S().tastings[el.dataset.id]; if(t) tastingDetail(t); },
  'edit-tasting': el => { const t = S().tastings[el.dataset.id]; if(t) tastingForm(t); },
  'del-tasting': el => { const t = S().tastings[el.dataset.id]; if(t) confirmSheet('노트 삭제', '이 시음 노트를 지울까요?', '삭제', () => { Store.del('tastings', t.id); toast('지웠어요'); }); },
  'learn-wine': el => { const t = S().tastings[el.dataset.id]; if(t) learnWine(t); },
  'label-find': () => labelFind(),
  'stash-open': el => { const g = tastedGroups().find(x => x.key === el.dataset.k); if(g) stashSheet(g.wine.name); },
  'stash-new': el => { const n = el.dataset.n; if(n) stashSheet(n); },
  'grape': el => { learnUI.grape = el.dataset.v; render(); },
  'band': el => { learnUI.band = el.dataset.v; render(); },
  'ai-q': el => aiAsk(el.dataset.v),
  'nick': () => nickSheet(),
  'gemini': () => geminiSheet(),
  'backup': () => backup(),
  'restore': () => restore(),
  'reset': () => resetSheet(),
  'maker-insta': () => openSheet(`<h2>궁뎅이형 인스타그램</h2>
    <div class="row" style="gap:14px;margin-bottom:16px"><div class="avatar">궁</div><div><div style="font-weight:700">@arc_o_o</div><div class="muted small">instagram.com/arc_o_o</div></div></div>
    <a class="btn block" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://www.instagram.com/arc_o_o/" target="_blank" rel="noopener">인스타그램에서 보기</a>
    <button class="btn soft block" style="margin-top:8px" id="mk-copy">링크 복사</button>`, { onMount(p){ p.querySelector('#mk-copy').onclick = () => copyText('https://www.instagram.com/arc_o_o/'); } }),
  'maker-mail': () => openSheet(`<h2>문의하기</h2>
    <p class="muted small" style="margin-top:-6px">앱에 대한 의견이나 궁금한 점을 메일로 보내주세요.</p>
    <div style="font-size:18px;font-weight:700;text-align:center;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;user-select:all;word-break:break-all">sadfinga@naver.com</div>
    <button class="btn block" style="margin-top:14px" id="mk-mail-copy">메일 주소 복사</button>
    <a class="btn soft block" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px" href="mailto:sadfinga@naver.com?subject=${encodeURIComponent('[와알못의 홀짝 시음기] 문의')}">메일 앱으로 보내기</a>
    <p class="note" style="margin-top:10px">메일 앱이 열리지 않으면 주소를 복사해서 보내주세요.</p>`, { onMount(p){ p.querySelector('#mk-mail-copy').onclick = () => copyText('sadfinga@naver.com'); } })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el);
});

Store.loadLocal();
render();
Store.connect();
caps();
}
</script>
</body>
</html>
